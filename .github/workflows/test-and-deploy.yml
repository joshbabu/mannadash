name: Test and deploy

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: mannadash_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: backend
        run: npm ci
      - name: Run backend tests
        working-directory: backend
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: app
          DB_PASSWORD: test_password
          DB_NAME: mannadash_test
          JWT_SECRET: test_jwt_secret_for_ci_only
          ADMIN_USERNAME: admin
          ADMIN_PASSWORD: test_admin_password_for_ci_only
        run: npm run test:e2e -- --runInBand

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: mannadash_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        run: |
          npm ci --prefix frontend
          npm ci --prefix restaurant-dashboard
          npm ci --prefix rider-app

      - name: Point frontends at the local test backend
        run: |
          echo "VITE_API_BASE=http://localhost:3000" > frontend/.env.local
          echo "VITE_API_BASE=http://localhost:3000" > restaurant-dashboard/.env.local
          echo "VITE_API_BASE=http://localhost:3000" > rider-app/.env.local

      - name: Install e2e dependencies and browser
        working-directory: e2e
        run: |
          # Works around a known GitHub Actions runner issue — a pre-installed Microsoft package
          # repo (for Azure CLI, which we don't use) periodically ships a broken signing key,
          # which blocks apt-get update entirely and takes down unrelated installs with it.
          sudo rm -f /etc/apt/sources.list.d/azure-cli.list /etc/apt/sources.list.d/microsoft-prod.list
          npm ci
          npx playwright install --with-deps chromium

      - name: Run e2e test
        working-directory: e2e
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: app
          DB_PASSWORD: test_password
          DB_NAME: mannadash_test
        run: npm test

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14

  deploy-backend:
    needs: [test, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Hetzner via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: bash /root/mannadash-app/deploy.sh

  deploy-frontends:
    needs: [test, e2e]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - dir: frontend
            project: mannadash-customer
          - dir: restaurant-dashboard
            project: mannadash-restaurant
          - dir: rider-app
            project: mannadash-rider
          - dir: admin-panel
            project: mannadash-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: ${{ matrix.dir }}
        run: npm ci
      - name: Build
        working-directory: ${{ matrix.dir }}
        run: npm run build
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ${{ matrix.project }}
          directory: ${{ matrix.dir }}/dist
