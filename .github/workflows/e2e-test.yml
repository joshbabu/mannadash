name: End-to-end test

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'restaurant-dashboard/**'
      - 'rider-app/**'
      - 'e2e/**'

jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: mannadash_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        run: |
          npm ci --prefix frontend
          npm ci --prefix restaurant-dashboard
          npm ci --prefix rider-app

      - name: Point frontends at the local test backend
        run: |
          echo "VITE_API_BASE=http://localhost:3000" > frontend/.env.local
          echo "VITE_API_BASE=http://localhost:3000" > restaurant-dashboard/.env.local
          echo "VITE_API_BASE=http://localhost:3000" > rider-app/.env.local

      - name: Install e2e dependencies and browser
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run e2e test
        working-directory: e2e
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: app
          DB_PASSWORD: test_password
          DB_NAME: mannadash_test
        run: npm test

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14
